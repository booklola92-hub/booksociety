<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc">
<title id="title">Cantinho aconchegante de leitura Book Society</title><desc id="desc">Livros empilhados, uma caneca de café, flores delicadas e uma manta em tons quentes.</desc>
<defs>
